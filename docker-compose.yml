services:
  postgres:
    build:
      context: ./docker/postgres
    container_name: ts-db-load-postgres
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
    container_name: ts-db-load-api
    environment:
      PORT: 3000
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: postgres
      PG_PASSWORD: password
      PG_DATABASE: postgres
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
